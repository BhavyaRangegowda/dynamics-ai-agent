# self hosted parameter enabled

trigger:
- main
- self-hosted

jobs:
- job: RunAutomation

  pool:
    ${{ if eq(variables['Build.SourceBranchName'], 'self-hosted') }}:
      name: BhavyaLaptop
    ${{ else }}:
      vmImage: ubuntu-latest

  steps:
  - ${{ if ne(variables['Build.SourceBranchName'], 'self-hosted') }}:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'
      displayName: 'Use Python 3.12 on Hosted Agent'

  - ${{ if eq(variables['Build.SourceBranchName'], 'self-hosted') }}:
    - script: |
        python --version
      displayName: 'Use Installed Python on Self Hosted Agent'

  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    displayName: 'Install dependencies'

  - script: |
      python test_orchestrator.py
    displayName: 'Run AI Automation Framework'
    env:
      JIRA_URL: $(JIRA_URL)
      JIRA_EMAIL: $(JIRA_EMAIL)
      JIRA_API_TOKEN: $(JIRA_API_TOKEN)
      PROJECT_KEY: $(PROJECT_KEY)
      GROQ_API_KEY: $(GROQ_API_KEY)
      DYNAMICS_URL: $(DYNAMICS_URL)
      DYNAMICS_USERNAME: $(DYNAMICS_USERNAME)
      DYNAMICS_PASSWORD: $(DYNAMICS_PASSWORD)
      EMAIL_SENDER: $(EMAIL_SENDER)
      EMAIL_PASSWORD: $(EMAIL_PASSWORD)
      EMAIL_RECIPIENTS: $(EMAIL_RECIPIENTS)
      EMAIL_SMTP_HOST: $(EMAIL_SMTP_HOST)
      EMAIL_SMTP_PORT: $(EMAIL_SMTP_PORT)
      GROQ_MODEL: $(GROQ_MODEL)

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '.'
      ArtifactName: 'automation-artifacts'
      publishLocation: 'Container'
    displayName: 'Publish Reports and Screenshots'